# Demographic bias — INTERSECTION (sex×age×family), CV-screening arm, Qwen3-0.6B.
#
# Corner contrast of the hiring factorial (the pregnancy window):
#   female ∧ age 30 ∧ on parental leave   vs   male ∧ age 50 ∧ in continuous employment.
# Generate the data first: python runners/generate_bios.py
#
#   python runners/run_battery.py --config configs/demographic_cv_intersection_qwen06.yaml    # every cell of the manifest
#   python runners/run_battery.py --config configs/demographic_cv_intersection_qwen06.yaml --axes intersection --encodings explicit    # this cell only
# (results: artifacts/results/demographic/battery_<domain>[_<manifest folder>]_<model>[__<axes>__<encodings>].json)

name: demographic_cv_intersection_qwen06
bias_type: demographic

model_path: Skywork/Skywork-Reward-V2-Qwen3-0.6B

dataset_source: data/demographic/cv/pairs.jsonl
probe_records: 150  # TODO(pilot): records, stratified by quality (probe_size counted pairs: ~38 records per axis)
max_test_examples: 200
split_seed: 42

batch_size: 8
max_length: 2048
device: auto


extra:
  domain: cv
