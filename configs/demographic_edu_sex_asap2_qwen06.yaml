# Demographic bias — EDUCATION (grading), sex via name proxy, Skywork-Reward-V2-Qwen3-0.6B.
#
# A1 header-proxy arm over real essays (ASAP 2.0, the essays not in PERSUADE). Same essay body, swap only
# the name in the header.
# Generate the data first (corpus is user-downloaded — see substrates/education_ingest.py):
#   python runners/generate_education.py --source asap2
#
#   python runners/run_experiment.py --config configs/demographic_edu_sex_asap2_qwen06.yaml
#
# The second sample (since 2026-09-27; it replaced ASAP-AES, whose results are superseded). The
# PERSUADE variant is configs/demographic_edu_sex_persuade_qwen06.yaml.

name: demographic_edu_sex_asap2_qwen06
bias_type: demographic

model_path: Skywork/Skywork-Reward-V2-Qwen3-0.6B
trust_remote_code: true

dataset_source: data/demographic/education/asap2/pairs.jsonl
dataset_name: edu_sex
probe_records: 150  # TODO(pilot): records, stratified by quality (probe_size counted pairs: ~38 records per axis)
max_test_examples: 200
split_seed: 42

null_alpha: 1.0
batch_size: 8
max_length: 2048
device: auto

save_probe: false

extra:
  domain: education
  axis: sex
  encoding: proxy
