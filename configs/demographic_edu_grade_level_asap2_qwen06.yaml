# Demographic bias — EDUCATION (grading), grade_level (age proxy), Skywork-Qwen3-0.6B.
#
# A1 header-proxy arm over real essays (ASAP 2.0). Same essay body, swap only
# the education-stage cue in the header (6th-grade pupil vs final-year doctoral candidate) as an
# age/maturity proxy.
# The stage design has its own manifest (<source>_stage/), built from the same essays as the
# sex x ethnicity x economic-status factorial in <source>/ (every essay x every template, since 2026-09-28).
#   python runners/generate_education.py --design stage --include-ladder
#
#   python runners/run_battery.py --config configs/demographic_edu_grade_level_asap2_qwen06.yaml    # every cell of the manifest
#   python runners/run_battery.py --config configs/demographic_edu_grade_level_asap2_qwen06.yaml --axes grade_level --encodings proxy    # this cell only
# (results: artifacts/results/demographic/battery_<domain>[_<manifest folder>]_<model>[__<axes>__<encodings>].json)
#
# The education corpus since 2026-09-27 (it replaced PERSUADE 2.0 and ASAP-AES, whose results are superseded).

name: demographic_edu_grade_level_asap2_qwen06
bias_type: demographic

model_path: Skywork/Skywork-Reward-V2-Qwen3-0.6B

dataset_source: data/demographic/education/asap2_stage/pairs.jsonl
probe_records: 150  # TODO(pilot): records, stratified by quality (probe_size counted pairs: ~38 records per axis)
max_test_examples: 200
split_seed: 42

batch_size: 8
max_length: 2048
device: auto


extra:
  domain: education
