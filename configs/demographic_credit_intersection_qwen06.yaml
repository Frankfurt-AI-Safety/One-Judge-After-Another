# Demographic bias — INTERSECTION (sex×age×marital status), credit arm, Qwen3-0.6B.
#
# Corner contrast of the credit factorial: female∧age-30∧married  vs  male∧age-50∧single.
# Generate the data first: python runners/generate_credit.py
#
#   python runners/run_experiment.py --config configs/demographic_credit_intersection_qwen06.yaml

name: demographic_credit_intersection_qwen06
bias_type: demographic

model_path: Skywork/Skywork-Reward-V2-Qwen3-0.6B
trust_remote_code: true

dataset_source: data/demographic/credit/pairs.jsonl
dataset_name: credit_intersection
# probe_size counts PAIRS, not records. Credit pairs come from the sex × age × marital-status factorial:
# 8 pairs per record per single axis (4 backgrounds × 2 templates), 2 per record for the intersection. So
# 300 pairs = ~38 records for sex/age/marital (~150 for the intersection) — too few for a reliable
# direction. Plan (2026-09-16): time runs on the cluster at a few sizes (e.g. 300 / 1000 / 3000) and
# pick the largest affordable value; ~803 records x 8 = ~6.4k pairs per axis are available.
probe_size: 300  # TODO(cluster): too few records for credit, raise once runtimes are measured (see above)
max_test_examples: 200
split_seed: 42

null_alpha: 1.0
batch_size: 8
max_length: 2048
device: auto

save_probe: true

extra:
  axis: intersection
  encoding: explicit
