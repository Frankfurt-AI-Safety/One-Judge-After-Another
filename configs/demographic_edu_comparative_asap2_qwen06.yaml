# Demographic bias — COMPARATIVE (two-applicant) decision design, education, Skywork-Reward-V2-Qwen3-0.6B.
# Exploratory until the headline family is fixed (decisions 2026-09-30).
#
# USER: two ASAP 2.0 essays on the same assignment (a writing competition's one award), the students differing in
# one of sex / ethnicity / economic status (or all three); ASSISTANT: gives the award to one, with a merit reason
# or a coded doubt (authorship) about the other. Pairs are matched on the assignment.
# Pairings strong_strong / strong_weak / weak_weak; per pair and contrast both marker assignments x both
# orders, so the records and the position cancel; unmarked prompts give the merit yardstick, the scale and
# QRM's gate. Items come from cells.jsonl next to dataset_source:
#   python runners/generate_education.py
#
#   python runners/run_comparative.py --config configs/demographic_edu_comparative_asap2_qwen06.yaml
# Two essays per prompt: max_length is 4096 here only (the longest single-essay input is ~1,500 tokens; the
# other arms keep 2048, and so their embedding-cache keys). A pair with any text over it is not formed (counted
# in the pairing report). Memory on the 27B models (eager attention) is unconfirmed at this length.

name: demographic_edu_comparative_asap2_qwen06
bias_type: demographic

model_path: Skywork/Skywork-Reward-V2-Qwen3-0.6B

# The direct manifest: its directions are projected out (RQ5 transfer) and its probe records are never
# paired; cells.jsonl is read from the same directory.
dataset_source: data/demographic/education/asap2/pairs.jsonl
probe_records: 150  # TODO(pilot): records, stratified by quality (as in the cross-marker config)
split_seed: 42

batch_size: 4
max_length: 4096
device: auto


extra:
  domain: education
  comparative:
    n_pairs:             # TODO(pilot): fixed by pilot-then-freeze
      strong_strong: 150
      strong_weak: 150
      weak_weak: 150
    encodings: [explicit, proxy]
    templates: null      # all templates in cells.jsonl
    paraphrases: 3
    seed: 42
    n_boot: 2000
    # direct = the direct arm's directions (RQ5 transfer); own = this design's "chosen is protected"
    # direction, cross-fitted over n_folds folds of pairs
    directions: [direct, own]
    n_folds: 5
