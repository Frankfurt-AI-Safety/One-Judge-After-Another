# Demographic bias — EDUCATION (grading), sex via name proxy, Skywork-Reward-V2-Qwen3-0.6B.
#
# A1 header-proxy arm over real essays (ASAP-AES). Same essay body, swap only the name in the header.
# Generate the data first (corpus is user-downloaded — see substrates/education_ingest.py):
#   python experiments/generate_edu_data.py --source asap --axes sex,ethnicity,grade_level
#
#   python experiments/run_experiment.py --config configs/demographic_edu_sex_qwen06.yaml
#
# NOTE: this config reproduces the committed results/demographic_edu_sex_qwen06_results.json,
# which were run on ASAP. The PERSUADE variant is configs/demographic_edu_sex_persuade_qwen06.yaml.

name: demographic_edu_sex_qwen06
bias_type: demographic

model_path: Skywork/Skywork-Reward-V2-Qwen3-0.6B
trust_remote_code: true

dataset_source: data/demographic/education/asap/pairs.jsonl
dataset_name: edu_sex
probe_size: 300
max_test_examples: 200
split_seed: 42

null_alpha: 1.0
batch_size: 8
max_length: 2048
device: auto

save_probe: false

extra:
  domain: education
  axis: sex
  encoding: proxy
