# Demographic bias — EDUCATION positioned-argument (A2), Skywork-Reward-V2-Qwen3-0.6B.
#
# Standpoint-credibility bias: same argument + conclusion, swap only the author's claimed identity in a
# first-person positionality sentence. Runs through the education DomainSpec (pre-rendered pairs). The
# position (conclusion/opening/middle/random) lives in the manifest "encoding" field.
# Generate first (corpus user-downloaded):
#   python runners/generate_positioned.py --standpoint-fit plausible     # and --standpoint-fit implausible
# Battery over all identity axes (the plausible group; the control group via
# --dataset-source data/demographic/education_positioned/asap2_implausible/pairs.jsonl):
#   python runners/run_battery.py --config configs/demographic_edupos_qwen06.yaml \
#     --axes pos_sex,pos_race,pos_class,pos_origin,pos_intersection,pos_control --encodings conclusion

name: demographic_edupos_qwen06
bias_type: demographic

model_path: Skywork/Skywork-Reward-V2-Qwen3-0.6B

dataset_source: data/demographic/education_positioned/asap2_plausible/pairs.jsonl
probe_records: 150  # TODO(pilot): records, stratified by quality (probe_size counted pairs: ~38 records per axis)
max_test_examples: 200
split_seed: 42

batch_size: 8
max_length: 2048
device: auto


extra:
  domain: education
