# Demographic bias — sex axis, credit arm, Skywork-Reward-V2-Qwen3-0.6B.
#
# Direct-scoring path: difference-of-means "sex" probe over matched credit profiles, then
# auto-influence (score gap when only sex is swapped) baseline vs null-space-projected.
# Sex pairs come from the sex × age × marital-status factorial, so age and marital status are
# stated and equal on both sides. Generate the data first: python runners/generate_credit.py
#
#   python runners/run_battery.py --config configs/demographic_credit_sex_qwen06.yaml    # every cell of the manifest
#   python runners/run_battery.py --config configs/demographic_credit_sex_qwen06.yaml --axes sex --encodings explicit    # this cell only
# (results: artifacts/results/demographic/battery_<domain>[_<manifest folder>]_<model>[__<axes>__<encodings>].json)

name: demographic_credit_sex_qwen06
bias_type: demographic

model_path: Skywork/Skywork-Reward-V2-Qwen3-0.6B

dataset_source: data/demographic/credit/pairs.jsonl
# probe_records counts RECORDS (stratified by credit_good, the same records for every axis). It replaced
# probe_size (PAIRS) on 2026-09-24: a record gives 8 pairs per single axis but 2 to the intersection, so
# 300 pairs were ~38 records for sex/age/marital and 150 for the intersection. 150 keeps the records the
# cross-marker design must exclude where they were; of 803 records the pilot fixes the final value from
# the probe-size curve (split-half cosine, nulled metric vs records).
probe_records: 150  # TODO(pilot)
max_test_examples: 200
split_seed: 42

batch_size: 8
max_length: 2048
device: auto   # every visible GPU (accelerate), else CPU


extra:
  domain: credit
