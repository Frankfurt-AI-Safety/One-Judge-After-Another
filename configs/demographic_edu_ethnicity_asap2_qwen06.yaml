# Demographic bias — EDUCATION (grading), ethnicity via name proxy, Skywork-Qwen3-0.6B.
#
# A1 header-proxy arm over real essays (ASAP 2.0). Same essay body, swap only
# the name in the header (white- vs Black-coded first name, holding sex fixed). A name-proxy effect, not
# pure ethnicity.
#   python runners/generate_education.py
#
#   python runners/run_battery.py --config configs/demographic_edu_ethnicity_asap2_qwen06.yaml    # every cell of the manifest
#   python runners/run_battery.py --config configs/demographic_edu_ethnicity_asap2_qwen06.yaml --axes ethnicity --encodings proxy    # this cell only
# (results: artifacts/results/demographic/battery_<domain>[_<manifest folder>]_<model>[__<axes>__<encodings>].json)
#
# The education corpus since 2026-09-27 (it replaced PERSUADE 2.0 and ASAP-AES, whose results are superseded).

name: demographic_edu_ethnicity_asap2_qwen06
bias_type: demographic

model_path: Skywork/Skywork-Reward-V2-Qwen3-0.6B

dataset_source: data/demographic/education/asap2/pairs.jsonl
probe_records: 150  # TODO(pilot): records, stratified by quality (probe_size counted pairs: ~38 records per axis)
max_test_examples: 200
split_seed: 42

batch_size: 8
max_length: 2048
device: auto


extra:
  domain: education
