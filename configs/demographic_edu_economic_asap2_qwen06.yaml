# Demographic bias — EDUCATION (grading), economic status, Skywork-Qwen3-0.6B.
#
# A1 header arm over real essays (ASAP 2.0). Same essay body, swap only the economic clause:
# explicit states the household income level, the proxy states the share of the school qualifying for
# free or reduced-price lunch (school poverty, the standard US measure) — so the two encodings measure
# related but different attributes, as the labels say (low_income/middle_income vs
# high_poverty_school/low_poverty_school).
#
# The third factor of the education factorial (sex x ethnicity x economic status), where sex and
# ethnicity share one carrier in the proxy encoding: the index-matched Haim name grid.
#   python runners/generate_education.py
#
#   python runners/run_battery.py --config configs/demographic_edu_economic_asap2_qwen06.yaml    # every cell of the manifest
#   python runners/run_battery.py --config configs/demographic_edu_economic_asap2_qwen06.yaml --axes economic_status --encodings proxy    # this cell only
# (results: artifacts/results/demographic/battery_<domain>[_<manifest folder>]_<model>[__<axes>__<encodings>].json)
#
# NOTE: new axis (2026-09-17), not yet run.

name: demographic_edu_economic_asap2_qwen06
bias_type: demographic

model_path: Skywork/Skywork-Reward-V2-Qwen3-0.6B

dataset_source: data/demographic/education/asap2/pairs.jsonl
probe_records: 150  # TODO(pilot): records, stratified by quality (probe_size counted pairs: ~38 records per axis)
max_test_examples: 200
split_seed: 42

batch_size: 8
max_length: 2048
device: auto


extra:
  domain: education
