# Zero-GPU shell for staging and inspection ONLY.
#
# Deliberately uses the STOCK Determined image: copying files and poking at PFSS needs rsync
# and a shell, not torch. That means staging is not blocked on the custom image build.
# Do NOT run experiments from this shell -- the stock image is py-3.8-pytorch-1.12 and cannot
# load our reward models. Use cluster/config.yaml for that.
#
#   det shell start -w IL_rm_bias --config-file cluster/config_stage.yaml
#
# Ready to use as-is.

bind_mounts:
  - container_path: /pfss/mlde/mlde_ext
    host_path: /pfss/mlde/mlde_ext
    propagation: rprivate
    read_only: false
  - container_path: /pfss/mlde/workspaces/mlde_wsp_IL_rm_bias
    host_path: /pfss/mlde/workspaces/mlde_wsp_IL_rm_bias
    propagation: rprivate
    read_only: false
  - container_path: /pfss/mlde/users/ck21zoly
    host_path: /pfss/mlde/users/ck21zoly
    propagation: rprivate
    read_only: false

description: staging shell (0 GPU, stock image)

idle_timeout: 1h

environment:
  add_capabilities:
    - IPC_LOCK
  force_pull_image: false
  image:
    # A slots=0 task uses the `cpu` entry. State it so staging runs the same NGC image the
    # GPU jobs do, rather than whatever default the platform would otherwise pick.
    cpu: determinedai/pytorch-ngc:0.35.0
    cuda: determinedai/pytorch-ngc:0.35.0
  environment_variables:
    # Same as config.yaml, so a staging shell and a GPU run resolve imports and the model
    # cache identically. Without these you have to export them by hand every session.
    # Exported so $PFSS is available in every task shell. Without it, the pip --target
    # and staging commands in the README silently expand to /pylibs and fail on the
    # filesystem root -- a shell variable set in one task does not survive into the next.
    - PFSS=/pfss/mlde/workspaces/mlde_wsp_IL_rm_bias
    - HF_HOME=/pfss/mlde/workspaces/mlde_wsp_IL_rm_bias/hf_cache
    # Requires the `hf_transfer` package in pylibs -- the Hub RAISES rather than
    # falling back if this is 1 and the package is absent.
    - HF_HUB_ENABLE_HF_TRANSFER=1
    - TOKENIZERS_PARALLELISM=false
    - PYTHONPATH=/pfss/mlde/workspaces/mlde_wsp_IL_rm_bias/OneBiasAfterAnotherFork:/pfss/mlde/workspaces/mlde_wsp_IL_rm_bias/pylibs

resources:
  # Stated explicitly: this workspace has no default compute pool, and the launch that
  # omitted it landed in `default` instead, where it sat queued.
  resource_pool: 42_Compute
  slots: 0
  weight: 1

work_dir: /pfss/mlde/workspaces/mlde_wsp_IL_rm_bias
