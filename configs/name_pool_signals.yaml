# Cohort and class signals of the proxy first names (pairs/markers.py name pools).
#
# Purpose: the pool-level check of the assumption stated above the pools in pairs/markers.py — that a
# name's sex (and, in education, ethnicity) signal dominates its age-cohort and class signals. What biases
# a proxy contrast is the difference between the two pools' MEANS (names are drawn uniformly per block),
# not the signal of any single name. Working notes, 2026-09-26.
# Data only: no code reads this file yet; tests/test_name_pool_signals.py keeps it in sync with the pools.
#
# ssa_*  — US Social Security Administration national baby-name counts, 1880-2017, as packaged in the R
#          package `babynames` 1.0.1 (CRAN, CC0; data/babynames.rda md5 863695efb777349b1244ced90526821e).
#          Only the births of the name to the pool's sex count. Spelling matched case-insensitively
#          (SSA writes "Daquan", "Deandre"). median/q25/q75: the count-weighted quantiles of the birth year
#          (births, not the living population: no mortality adjustment). births: total count 1880-2017.
#          same_sex_share: the pool sex's share of all births with the name (a sex-ambiguity indicator).
#          Truncated at 2017: names still near their peak then (Logan, Claire, Abigail, Hunter) would have
#          later medians with 2018+ data. Claire is bimodal (IQR 1947-2008), so its median is a poor summary.
# gaddis_* — Gaddis (2017), "How Black Are Lakisha and Jamal?", Sociological Science 4:469-489, online
#          supplement Table A1: New York State birth records 1994-2012. pct_some_college: % of mothers
#          with some college or more among children given the name — an objective SES correlate of the
#          naming families, NOT a perceived-class rating. race: plurality race of the mothers (W/B).
#          ny_births: the name's total count there (small for Lakisha 22, Latonya 15: noisy).
#          Haim et al. (2024) drew all 40 names from Gaddis's 200-name set, so every name is covered.
# Perceived class: Crabtree et al. (2023, Scientific Data 10:130, CC BY 4.0) rate perceived income and
#          education for 600 first+last names, but only 5 of our 40 first names are among theirs (Lakisha,
#          Latonya, Latoya, Tamika, Tanisha — one pool), so it cannot give a between-pool gap. Not included.
# Retrieved 2026-09-26.

