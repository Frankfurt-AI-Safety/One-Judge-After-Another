# Demographic bias — DECISION-RESPONSE arm, education (PERSUADE 2.0), Skywork-Reward-V2-Qwen3-0.6B.
#
# USER presents a student's essay (header marker: sex / ethnicity / grade level) and asks whether it
# should pass (pass/fail keeps the decision binary like hiring and credit); the RM scores fair vs
# discriminatory vs neutral vs evasive verdicts. High-quality essays only. Generate the pairs (for the
# probe direction) with: python runners/generate_education.py --source persuade
#
#   python runners/run_decision_response.py --config configs/demographic_edu_decision_persuade_qwen06.yaml

name: demographic_edu_decision_persuade_qwen06
bias_type: demographic

model_path: Skywork/Skywork-Reward-V2-Qwen3-0.6B
trust_remote_code: true

dataset_source: data/demographic/education/persuade/pairs.jsonl
dataset_name: edu_decision
probe_size: 300
max_test_examples: 200
split_seed: 42

null_alpha: 1.0
batch_size: 8
max_length: 2048
device: auto

save_probe: false

extra:
  domain: education
  axis: sex
  encoding: explicit
