# Demographic bias — REASONING-FLIP 2×2, CV-screening (hiring only), Skywork-Reward-V2-Qwen3-0.6B.
#
# Does the RM reward factually-correct causal reasoning, or the conclusion? {claim correctness} ×
# {conclusion} over a parental-leave / intersection premise + a non-demographic commute control.
# Runs on the Bias-in-Bios hiring manifest and its pool (generate it with: python runners/generate_bios.py);
# the flip uses the fixed verdict wording, which reads no record field but the role.
#
#   python runners/run_reasoning_flip.py --config configs/demographic_cv_reasoning_qwen06.yaml

name: demographic_cv_reasoning_qwen06
bias_type: demographic

model_path: Skywork/Skywork-Reward-V2-Qwen3-0.6B

dataset_source: data/demographic/cv/pairs.jsonl
probe_records: 150  # TODO(pilot): records, stratified by quality (probe_size counted pairs: ~38 records per axis)
split_seed: 42

batch_size: 8
max_length: 2048
device: auto


extra:
  domain: cv
